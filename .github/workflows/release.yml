name: Release

# ★ 打 vX.Y.Z 标签即发布：
#     git tag v1.0.0 && git push origin main v1.0.0
#   → 自动构建自包含单文件 exe → 跑离线回归 → 创建 Release 并上传 exe。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的标签（如 v1.0.0）'
        required: true

permissions:
  contents: write          # ★ 创建 Release + 上传附件需要

jobs:
  release:
    name: 构建并发布
    runs-on: windows-latest
    env:
      # ★ Windows runner 的 stdout 是管道，Python 默认取 ANSI 代码页（cp1252）
      #   ⇒ 打印中文直接 UnicodeEncodeError 崩掉（首次 CI 就这么挂的）。
      #   开 UTF-8 模式（PEP 540）统一按 UTF-8 读写。
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # ── 0. 版本号必须与标签一致：不一致直接停，别产出无法回溯的包 ──
      #    ★ 仓库里版本号有三处副本（build.cmd / build.sh / csproj 的 PkgVersion），
      #      下面的构建又用标签覆盖 PkgVersion —— 只靠标签会让仓库版本悄悄漂移。
      - name: 校验版本号与标签一致
        shell: pwsh
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          python tools/check_version.py "$env:TAG"
          if ($LASTEXITCODE -ne 0) { throw "版本号与标签不一致，拒绝发布" }

      # ── 1. 先跑回归：回归不过就不发版 ──
      #    ★ 用的是**离线**回归（C# + Python），不发网络请求。
      #    界面自检 --uitest 需要真实登录态与收藏夹，CI 上跑不了，故不纳入。
      - name: C# 离线回归（签名 / 请求头 / 界面 / 命名 / DRM / 兴趣岛内核）
        shell: pwsh
        run: |
          dotnet restore hgvd-csharp/src/Hgvd.Tests/Hgvd.Tests.csproj --configfile .github/nuget.ci.config
          dotnet build   hgvd-csharp/src/Hgvd.Tests/Hgvd.Tests.csproj -c Debug --no-restore
          ./hgvd-csharp/src/Hgvd.Tests/bin/Debug/net8.0-windows/Hgvd.Tests.exe

      - name: Python 离线回归
        shell: pwsh
        run: |
          pip install -r requirements.txt
          python -m tests.run

      # ── 2. 按标签版本号构建两种形态 ──
      #    ★ 主推 **B 案**：自包含目录版 + zip（启动快、杀软友好、ffmpeg 可换）
      #    ★ 同时保留单文件 exe（给"我就要一个文件"的人）
      #    ★ 两者必须分两次 publish —— PublishSingleFile 是 publish 期属性
      - name: 准备内置 ffmpeg / ffprobe
        shell: pwsh
        run: |
          ./hgvd-avalonia/prepare-ffmpeg.ps1

      - name: 发布自包含目录版（B 案主推）
        shell: pwsh
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          $ver = $env:TAG -replace '^v',''
          if (-not $ver) { throw "拿不到版本号（TAG=$env:TAG）" }
          Write-Host ">>> 发布版本: $ver"
          $pkg = "hgvd-avalonia/pkg/hgvd-downloader-v$ver"
          if (Test-Path $pkg) { Remove-Item $pkg -Recurse -Force -Confirm:$false }
          dotnet restore hgvd-avalonia/src/Hgvd.Avalonia/Hgvd.Avalonia.csproj -p:Configuration=Release --configfile .github/nuget.ci.config -r win-x64
          # ★ 目录版不内嵌 ffmpeg（EmbedFfmpeg=false），下面把 exe 摊进包里
          dotnet publish hgvd-avalonia/src/Hgvd.Avalonia/Hgvd.Avalonia.csproj -c Release --no-restore -o $pkg -p:PublishSingleFile=false -p:EmbedFfmpeg=false -p:PkgVersion=$ver
          # ★ ffmpeg/ffprobe 复制进目录版（可单独替换；单文件版仍靠内嵌）
          foreach ($tool in @('ffmpeg', 'ffprobe')) {
            $src = ".cache/ffmpeg/$tool.exe"
            if (-not (Test-Path $src)) { throw "缺少 $src（prepare-ffmpeg 应已生成）" }
            Copy-Item -LiteralPath $src -Destination $pkg -Force
          }
          Get-ChildItem $pkg | Measure-Object -Property Length -Sum |
            ForEach-Object { Write-Host ("    目录版 {0} 个文件，共 {1:N1} MB" -f $_.Count, ($_.Sum / 1MB)) }

      - name: 打成 zip（顶层保留文件夹名 + README.txt）
        shell: pwsh
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          $ver = $env:TAG -replace '^v',''
          python tools/pack_zip.py "hgvd-avalonia/pkg/hgvd-downloader-v$ver" `
                                   "hgvd-avalonia/dist/hgvd-downloader-v$ver-win-x64.zip" `
                                   "hgvd-avalonia/PACK-README.txt"

      - name: 发布单文件 exe（备用形态）
        shell: pwsh
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          $ver = $env:TAG -replace '^v',''
          dotnet publish hgvd-avalonia/src/Hgvd.Avalonia/Hgvd.Avalonia.csproj -c Release --no-restore -o hgvd-avalonia/dist -p:PkgVersion=$ver
          Get-ChildItem hgvd-avalonia/dist | Format-Table Name, Length

      # ── 3. 核对产物：文件名 + 文件版本都要跟标签一致 ──
      #    ★ 界面上的版本号读的是程序集版本（AboutWindow.AppVersion），
      #      csproj 里 <Version>$(PkgVersion)</Version> 保证二者一致。
      - name: 核对产物版本
        shell: pwsh
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          $ver = $env:TAG -replace '^v',''
          $exe    = "hgvd-avalonia/dist/hgvd-downloader-v$ver.exe"
          $zip    = "hgvd-avalonia/dist/hgvd-downloader-v$ver-win-x64.zip"
          $pkgExe = "hgvd-avalonia/pkg/hgvd-downloader-v$ver/hgvd-downloader-v$ver.exe"
          foreach ($f in @($exe, $zip, $pkgExe)) {
            if (-not (Test-Path $f)) { throw "产物不对：$f 不存在" }
          }
          # FileVersion 形如 "1.0.1.0"，用前缀比较（别用等值）
          foreach ($f in @($exe, $pkgExe)) {
            $fv = (Get-Item $f).VersionInfo.FileVersion
            Write-Host ">>> $f   FileVersion=$fv"
            if (-not $fv.StartsWith($ver)) { throw "文件版本($fv) 与标签($ver) 不一致：$f" }
          }
          $zipMb  = [math]::Round((Get-Item $zip).Length / 1MB, 1)
          $exeMb  = [math]::Round((Get-Item $exe).Length / 1MB, 1)
          Write-Host ">>> 目录版 zip ${zipMb} MB ／ 单文件 exe ${exeMb} MB"

      # ── 4. 建 Release、传附件 ──
      #    ★ zip 放前面：下载页第一个附件就是主推形态
      - name: 创建 Release 并上传附件
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: 红果视频下载器 ${{ github.event.inputs.tag || github.ref_name }}
          draft: false
          body: |
            ## 一个窗口，两个内容源

            红果收藏夹里的剧集、兴趣岛「我的课程」里的课，都能成批导出成通用 MP4。
            两源**共用同一张下载清单**、同一条队列、同一个日志。

            <!-- ★ 每次发版改这一段：标题版本号 + 更新条目 -->
            ## 本版更新（v1.8.0）

            - **下载大幅提速**：按下下载键先一次性预检，已下完的分集直接跳过（不再逐集
              校验，180 集里已下 100 集的场景从约 5 秒空转降到约 1 秒）；未下完的集
              有进度记账，异常退出/正常关闭都会留记录，下次接着下。
            - **直链先行 + 2 路并发**：勾选剧目后在后台提前解析后续 10 集的直链，
              下载时直接命中、不必现场等解析；两集同时下载，某一集失败不再卡住全体。
            - **目录版不再内嵌 ffmpeg**：ffmpeg/ffprobe 作为独立文件随目录分发，
              可单独替换、启动更快；单文件版仍内嵌（首次运行自解压）。
            - 播放接口拿不到直链时，可先在 App 里播放，再用「**提取App缓存**」取出下完的视频。

            > 上一个版本（v1.7.0）已移除「抓流」：它靠本机 MITM 代理拦 App 的播放响应取直链，

            > 红果接口改版后失效，连根删除（含 MITM 组件、白名单表、`grab` 子命令），

            > 发版门禁随之从三道精简为两道（界面自检 + 下载链路）。

            > 更早已收紧口径为「只下收藏夹里的教材/合集类视频」，

            > 并移除了「按剧 ID 自动抓剧」入口。



            ## 下哪个？

            **推荐：`hgvd-downloader-v*-win-x64.zip`（目录版，约 54 MB）**
            - 解压后双击 exe 就能用，不需要装 .NET
            - 启动比单文件版快，也不容易被安全软件误判
            - ⚠️ **必须先「全部解压」再运行**，不要直接在压缩包里双击 exe

            **备选：`hgvd-downloader-v*.exe`（单文件，约 58 MB）**
            - 就一个文件，拷到哪都能跑
            - 首次启动会慢几秒（要把内置的 ffmpeg 解压到本机缓存）

            两种形态功能完全一样。系统要求：Windows 10/11 64 位，零安装
            （.NET 运行时与 ffmpeg / ffprobe 都已打包在内）。

            ## 三步

            1. 左上角选内容源：**红果视频** / **兴趣岛课程**
            2. 点「获取授权」—— 启动时不会自动读模拟器，只在这一步读**当前源对应 App** 的登录态（优先从雷电读取）
            3. 左栏勾选剧目 / 营 → 条目追加到右栏清单（可累计）→ 点「下载」

            双击清单某一行 = 只下这一条；下载/暂停/继续共用一个按钮，两源统一（暂停保留连接/分片）。

            清单上方可按状态筛选（全部 / 待下载 / 下载中 / 已完成 / 失败），每行标明来源与剩余时间；
            右键 = 下载 / 重新下载（清缓存）/ 复制 / 打开文件夹 / 移出清单，`Delete` 同效；
            右上角「历史」查看两源共用的下载记录。重启后两边的清单都会自动恢复。

            ## 两个源分别能下什么

            | 源 | 能下 | 说明 |
            |---|---|---|
            | 红果 · 教学合集 | ✅ 完整正片 | 断点续传 / 已存在跳过 / 成品时长校验 |
            | 红果 · 短剧 | ⚠️ 能下能解密 | bytevc2 抹掉 SPS/PPS，ffmpeg 解不出画面；批量下载默认跳过 |
            | 红果 · 图书/听书 | ❌ | 服务端没有视频 |
            | 兴趣岛 · 正式营 / 体验营 / 公开课 | ✅ | 课表自动发现、现场解析播放地址、HLS 分片并发 + ffmpeg 合成 |

            兜底路径：红果「提取App缓存」（不经过播放接口）；兴趣岛「链接…」手动粘贴课程地址。

            ## 合规

            - 只处理**你自己账号下有权访问与保存**的内容（已购课程 / 已开通的营 / 公开课 / 自己的收藏）
            - 不提供未购内容的获取能力，不破解 DRM；内容密钥按官方播放器同一套规则在本地解包
            - **软件本身仅限非商业使用**（PolyForm Noncommercial 1.0.0）：可研究、教学、个人使用，禁止商用
            - 下载的内容仅供个人学习、备份与离线观看；**不得传播、转售、公开发布或用于商业用途**，看完请及时删除
            - 登录态与清单只存本机 `%USERPROFILE%\.hgv_tool\`，不上传任何账号信息

            ## 许可与版权

            © 2026 chisenin，按 **PolyForm Noncommercial 1.0.0** 授权：
            允许个人学习、研究、教学等**非商业**使用（可改、可再分发，须随附许可），
            **禁止任何商业用途**。许可全文见仓库 `LICENSE`（zip 包内为 `LICENSE.txt`）；
            严格说它不属于 OSI 开源许可，属源码可用（source-available）。商用请先联系作者。

            内置的 ffmpeg / ffprobe 是第三方独立程序（GPL 构建），版权归 FFmpeg 项目；
            其余第三方声明见 `NOTICE.md`（zip 包内为 `NOTICE.txt`）。下载内容的版权仍归原作者与平台所有。

            ## 遇到问题

            提 issue 时请带上：下载的附件名、界面右下角版本号、日志面板里的报错文字。
          files: |
            hgvd-avalonia/dist/hgvd-downloader-v*-win-x64.zip
            hgvd-avalonia/dist/hgvd-downloader-v*.exe

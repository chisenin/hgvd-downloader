name: CI

# ★ 每次 push / PR 都跑一遍「离线回归」——不发任何网络请求，
#   几秒出结果，用来挡住签名链/请求头/界面回归的破坏。
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-regression:
    name: 离线回归
    runs-on: windows-latest
    env:
      # ★ Windows runner 的 stdout 是管道，Python 默认取 ANSI 代码页（cp1252）
      #   ⇒ 打印中文直接 UnicodeEncodeError 崩掉（首次 CI 就这么挂的）。
      #   开 UTF-8 模式（PEP 540）统一按 UTF-8 读写。
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: C# 离线回归（72 项：签名黄金向量 / 请求头 / 发行版界面 / 命名 / MuMu 定位）
        shell: pwsh
        run: |
          dotnet restore hgvd-csharp/src/Hgvd.Tests/Hgvd.Tests.csproj --configfile .github/nuget.ci.config
          dotnet build   hgvd-csharp/src/Hgvd.Tests/Hgvd.Tests.csproj -c Debug --no-restore
          ./hgvd-csharp/src/Hgvd.Tests/bin/Debug/net8.0-windows/Hgvd.Tests.exe

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Python 离线回归（90 项，含「空 body 不得归因为限流」的文案护栏）
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m tests.run

      - name: 发行版能构建出单文件 exe
        shell: pwsh
        run: |
          dotnet restore hgvd-avalonia/src/Hgvd.Avalonia/Hgvd.Avalonia.csproj -p:Configuration=Release --configfile .github/nuget.ci.config -r win-x64
          dotnet publish  hgvd-avalonia/src/Hgvd.Avalonia/Hgvd.Avalonia.csproj -c Release --no-restore -o hgvd-avalonia/dist -p:PkgVersion=0.0.0-ci
          Get-ChildItem hgvd-avalonia/dist | Format-Table Name, Length
